# Docker Compose for VMS
# Spins up: Redis, Backend API, Frontend (using external NeonDB)

services:
  # ---- Redis (for rate limits / caching) ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ---- Backend API ----
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - redis
    env_file:
      - ./backend/.env
    environment:
      # These default overrides ensure the container uses Redis correctly
      REDIS_URL: redis://redis:6379
      NODE_ENV: production

  # ---- Frontend ----
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
